{% load static %}
{% include "layout/partials/user/header.html" %}

<style>
.counsellor-section {
    padding: 70px 0;
    background-color: #f5f7fa;
}

.section-title {
    text-align: center;
    margin-bottom: 50px;
}

.section-title h2 {
    font-weight: 700;
    color: #2c3e50;
}

.counsellor-card {
    background: #ffffff;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    transition: 0.3s ease;
    height: 100%;
}

.counsellor-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
}

.counsellor-img {
    width: 100%;
    height: 260px;
    object-fit: cover;
}

.counsellor-body {
    padding: 20px;
    text-align: center;
}

.counsellor-name {
    font-size: 20px;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 5px;
}

.counsellor-special {
    color: #a5c422;
    font-weight: 500;
    margin-bottom: 8px;
}

.counsellor-exp {
    font-size: 14px;
    color: #666;
    margin-bottom: 15px;
}

.view-btn {
    background-color: #a5c422;
    color: #ffffff;
    padding: 8px 20px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: 500;
    transition: 0.3s ease;
    display: inline-block;
}

.view-btn:hover {
    background-color: #8cab1b;
    color: #ffffff;
    text-decoration: none;
}
</style>

<section class="counsellor-section">
    <div class="container">

        <!-- Title -->
        <div class="section-title">
            <h2>Our Counsellors</h2>
        </div>

        <div class="row">
            {% for i in vdi %}
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="counsellor-card">

                    <!-- Image -->
                    <a href="{% url 'user:vdetail' i.id %}">
                        <img src="/media/{{i.photo}}" 
                             class="counsellor-img"
                             alt="Counsellor">
                    </a>

                    <!-- Content -->
                    <div class="counsellor-body">
                        <div class="counsellor-name">
                            {{i.user.name}}
                        </div>

                        <div class="counsellor-special">
                            {{i.special}}
                        </div>

                        <div class="counsellor-exp">
                            {{i.exp}} Years Experience
                        </div>

                        <a href="{% url 'user:vdetail' i.id %}" 
                           class="view-btn">
                           View Profile
                        </a>
                    </div>

                </div>
            </div>
            {% endfor %}
        </div>

    </div>
</section>

{% include "layout/partials/user/footer.html" %}
