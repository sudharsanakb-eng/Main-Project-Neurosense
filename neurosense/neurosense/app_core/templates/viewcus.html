{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f7fb;
font-family:'Segoe UI',sans-serif;
}

.sidebar{
height:100vh;
background:#1f2a40;
color:white;
padding:25px;
position:fixed;
width:230px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
border-radius:8px;
margin-bottom:10px;
}

.sidebar a:hover{
background:#2d3c5a;
}

.main{
margin-left:250px;
padding:30px;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

</style>

</head>

<body>

<div class="sidebar">

<h3>NeuroSense</h3>

<a href="{% url 'dashboard:admin' %}">Dashboard</a>
<a href="{% url 'core:cust' %}">Customers</a>
<a href="{% url 'core:vacc' %}">Counsellors Accept</a>
<a href="{% url 'core:vcon' %}">Counsellors</a>
<a href="{% url 'dashboard:logout' %}">Logout</a>

</div>

<div class="main">

<h2 class="mb-4">Customers</h2>

<div class="card p-4">

<div class="table-responsive">

<table class="table table-striped">

<thead>
<tr>
<th>#</th>
<th>Name</th>
<th>Address</th>
<th>DOB</th>
<th>Age</th>
<th>Email</th>
<th>Contact</th>
</tr>
</thead>

<tbody>

{% for i in vdi %}

<tr>

<td>{{ forloop.counter }}</td>
<td>{{ i.user.name }}</td>
<td>{{ i.address }}</td>
<td>{{ i.dob }}</td>
<td>{{ i.age }}</td>
<td>{{ i.user.email }}</td>
<td>{{ i.contact }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</body>
</html>
