{% load static %}
{% include "layout/partials/user/header.html" %}

<style>
/* Section Background */
.question-section {
    padding: 80px 0;
    background: #f4f7fb;
}

/* Card Container */
.question-card {
    background: #ffffff;
    padding: 50px;
    border-radius: 15px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

/* Title */
.question-title {
    text-align: center;
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 40px;
    color: #2c3e50;
}

/* Question Label */
.question-label {
    font-weight: 600;
    margin-bottom: 8px;
    color: #333;
}

/* Input Styling */
.question-input {
    border-radius: 8px;
    padding: 12px;
    border: 1px solid #ddd;
    transition: 0.3s;
    margin-bottom: 20px;
}

.question-input:focus {
    border-color: #a5c422;
    box-shadow: 0 0 0 2px rgba(165,196,34,0.2);
    outline: none;
}

/* Submit Button */
.submit-btn {
    background-color: #a5c422;
    color: #fff;
    padding: 12px 30px;
    border-radius: 30px;
    border: none;
    font-weight: 600;
    transition: 0.3s;
    width: 100%;
    margin-top: 10px;
}

.submit-btn:hover {
    background-color: #8cab1b;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}
</style>

<section class="question-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="question-card">
                    <h2 class="question-title">Questions</h2>

                    <form method="POST" action="{% url 'dashboard:qview' %}">
                        {% csrf_token %}

                        {% for i in vdi %}
                        <div class="form-group">
                            <label class="question-label">
                                {{ i.question }}
                            </label>
                            <input type="text" 
                                   name="question_{{ forloop.counter }}" 
                                   class="form-control question-input" 
                                   placeholder="Type your answer here..." 
                                   required>
                        </div>
                        {% endfor %}

                        <button type="submit" class="submit-btn">
                            Submit Answers
                        </button>

                    </form>
                </div>

            </div>
        </div>
    </div>
</section>

{% include "layout/partials/guest/footer.html" %}
