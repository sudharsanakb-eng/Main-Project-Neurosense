  <!-- MAKE AN APPOINTMENT -->
{% load static %}
{% include "layout/partials/guest/header.html" %}
     <section id="appointment" data-stellar-background-ratio="3">
          <div class="container">
               <div class="row">

                    <div class="col-md-6 col-sm-6">
                         <img src="{% static 'guest/images/appointment-image.jpg' %}" class="img-responsive" alt="">
                    </div>
                      <form method="POST" action="{% url 'dashboard:login' %}"></form>
                      {% csrf_token %}
                    <div class="col-md-6 col-sm-6">
                         <!-- CONTACT FORM HERE -->
                         <form id="appointment-form" role="form" method="post" action="#">

                              <!-- SECTION TITLE -->
                              <div class="section-title wow fadeInUp" data-wow-delay="0.4s">
                                   <h2>Sign In </h2>
                              </div>

                              <div class="wow fadeInUp" data-wow-delay="0.8s">
                                   <div class="col-md-6 col-sm-6">
                                        <label for="name">Name</label>
                                        <input type="text" class="form-control" id="name" name="name" placeholder="Full Name">
                                   </div>

                                   <div class="col-md-6 col-sm-6">
                                        <label for="email">Email</label>
                                        <input type="email" class="form-control" id="email" name="email" placeholder="Your Email">
                                   </div>

                                   <div class="col-md-6 col-sm-6">
                                        <label for="date">Date Of Birth</label>
                                        <input type="date" name="date" value="" class="form-control">
                                   </div>

                                   <div class="col-md-6 col-sm-6">
                                        <label for="select">Gender</label>
                                        <select class="form-control">
                                             <option>Male</option>
                                             <option>Female</option>
                                             <option>Other</option>
                                        </select>
                                   </div>

                                   <div class="col-md-12 col-sm-12">
                                        <label for="telephone">Phone Number</label>
                                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="Phone">
                                        <button type="submit" class="form-control" id="cf-submit" name="submit">SIGH UP</button>
                                   </div>
                              </div>
                        </form>
                    </div>

               </div>
          </div>
     </section>
{% include "layout/partials/guest/footer.html" %}
