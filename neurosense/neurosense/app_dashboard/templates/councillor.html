{% include "layout/partials/guest/header.html" %}

<style>
.gap-sm {
  display: flex;
  gap: 10px;
}
</style>

<div class="container">
  <div class="page-inner">
    
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          
       <div class="card-title" style="font-size: 28px; font-weight: 800;">
  COUNSELLOR DETAILS
</div>

          <div class="card-body">
            <form action="{% url 'dashboard:con' %}" 
                  method="POST" 
                  enctype="multipart/form-data">
              {% csrf_token %}

              <div class="row">

                <!-- Name -->
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control"
                      name="name"
                      placeholder="Enter name"
                      required
                      pattern="^[A-Z][a-zA-Z\s]*$"
                      title="Name must start with a capital letter and contain only letters.">
                  </div>
                </div>

                <!-- Specialization -->
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Specialization</label>
                    <input type="text" class="form-control"
                      name="special"
                      placeholder="Enter specialization">
                  </div>
                </div>

                <!-- Experience -->
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Experience (Years)</label>
                    <input type="number" class="form-control"
                      name="exp"
                      placeholder="Enter years of experience">
                  </div>
                </div>

                <!-- Doctor Number -->
                <div class="col-md-6">
                  <div class="form-group">
                    <label>License / Doctor Number</label>
                    <input type="text" class="form-control"
                      name="number"
                      placeholder="Enter license number">
                  </div>
                </div>

                <!-- Username -->
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control"
                      name="username"
                      placeholder="Enter username"
                      required minlength="8">
                  </div>
                </div>

                <!-- Password -->
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control"
                      name="password"
                      placeholder="Enter password"
                      required minlength="8">
                  </div>
                </div>

                <!-- Email -->
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control"
                      name="email"
                      placeholder="Enter email">
                  </div>
                </div>

                <!-- Contact -->
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Contact</label>
                    <input type="tel" class="form-control"
                      name="contact"
                      placeholder="Enter phone number"
                      pattern="[0-9]{10}"
                      title="Enter valid 10 digit number">
                  </div>
                </div>

                <!-- About -->
                <div class="col-md-12">
                  <div class="form-group">
                    <label>About</label>
                    <textarea class="form-control"
                      name="desc"
                      rows="3"
                      placeholder="Enter description"></textarea>
                  </div>
                </div>

                <!-- Image -->
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Profile Image</label>
                    <input type="file" class="form-control"
                      name="img">
                  </div>
                </div>

                <!-- Daily Count -->
                <div class="col-md-3">
                  <div class="form-group">
                    <label>Daily Count</label>
                    <input type="number" class="form-control"
                      name="count"
                      placeholder="Enter count">
                  </div>
                </div>

                <!-- Fee -->
                <div class="col-md-3">
                  <div class="form-group">
                    <label>Fee</label>
                    <input type="number" class="form-control"
                      name="fee"
                      placeholder="Enter amount">
                  </div>
                </div>

                <!-- Gender -->
                <div class="col-md-6">
                  <div class="form-group">
                    <label>Gender</label>
                    <select class="form-control" name="gender" required>
                      <option value="" disabled selected>Select Gender</option>
                      <option>Male</option>
                      <option>Female</option>
                      <option>Other</option>
                    </select>
                  </div>
                </div>

              </div>

              <!-- Buttons -->
              <div class="d-flex justify-content-end gap-sm mt-3">
                <button type="submit" class="btn btn-success">
                  Submit
                </button>

                <button type="button" class="btn btn-light"
                  onclick="window.history.back();">
                  Cancel
                </button>
              </div>

            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

{% include "layout/partials/counsellor/footer.html" %}
