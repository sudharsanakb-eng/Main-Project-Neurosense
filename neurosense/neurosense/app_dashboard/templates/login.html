  <!-- MAKE AN APPOINTMENT -->
{% load static %}
{% include "layout/partials/guest/header.html" %}
     <section id="appointment" data-stellar-background-ratio="3">
          <div class="container">
               <div class="row">

                    <div class="col-md-6 col-sm-6">
                         <img src="{% static 'guest/images/appointment-image.jpg' %}" class="img-responsive" alt="">
                    </div>
                      
                    <div class="col-md-6 col-sm-6">
                         <!-- CONTACT FORM HERE -->
                         <form id="appointment-form" role="form" method="POST" action="{% url 'dashboard:login' %}">
                       {% csrf_token %}
                             

                              <!-- SECTION TITLE -->
                              <div class="section-title wow fadeInUp" data-wow-delay="0.4s">
                                   <h2>LOG IN </h2>
                              </div>
                              <div class="col-md-12 col-sm-12">
                                        <label for="telephone">User Name</label>
                                        <input type="tel" class="form-control" id="Name" name="Name" placeholder="Name" >
                                       
                                   </div>

                              

                                   
                                   <div class="col-md-12 col-sm-12">
                                        <label for="telephone">Password</label>
                                        <input type="password" class="form-control" id="password" name="password" placeholder="password" >
                                        <button type="submit" class="form-control" id="cf-submit" name="submit">LOG IN</button>
                                        <div style="margin-top: 15px; text-align: center;">
                                        <p>don't have an account</p>
                                        <a href="{% url 'dashboard:cust' %}" class="btn btn-default">
                                        Register now
                                        </a>
                                        </div>

                                   </div>
                              </div>
                        </form>
                    </div>

               </div>
          </div>
     </section>
{% include "layout/partials/guest/footer.html" %}
